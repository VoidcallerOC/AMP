name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f vercel.json
          test -f robots.txt
          test -f sitemap.xml
          test -f assets/css/styles.css
          test -f assets/js/config.js
          test -f assets/js/main.js
          test -f assets/img/brand/favicon.svg

      - name: Validate HTML structure
        run: |
          grep -qi "<!doctype html>" index.html
          grep -qi "<html" index.html
          grep -qi "</html>" index.html
